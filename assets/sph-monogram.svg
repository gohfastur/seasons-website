<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Seasons Property Holdings monogram">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&amp;display=swap');
      .ring  { fill:none; stroke:#1A1A18; stroke-width:4; stroke-linecap:round; }
      .ring--clay { stroke:#C4673D; }
      .s { font-family:'Fraunces', Georgia, 'Times New Roman', serif; font-weight:500;
           font-size:66px; fill:#1A1A18; }
    </style>
  </defs>
  <!-- Quartered ring: four arcs = the four seasons turning -->
  <path class="ring"      d="M109.51 66.96 A50 50 0 0 1 66.96 109.51"/>
  <path class="ring"      d="M53.04 109.51 A50 50 0 0 1 10.49 66.96"/>
  <path class="ring"      d="M10.49 53.04 A50 50 0 0 1 53.04 10.49"/>
  <path class="ring ring--clay" d="M66.96 10.49 A50 50 0 0 1 109.51 53.04"/>
  <!-- High-contrast serif S -->
  <text class="s" x="60" y="60" text-anchor="middle" dominant-baseline="central">S</text>
</svg>
